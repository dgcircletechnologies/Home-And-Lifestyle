name: home-lifestyle-decor
services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      FRONTEND_PORT: ${FRONTEND_PORT:-5007}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:9007/api}
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5007}:${FRONTEND_PORT:-5007}"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: ${DOCKER_DATABASE_URL:?Set DOCKER_DATABASE_URL in root .env}
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${BACKEND_PORT:-9007}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5007}
      STORE_NAME: ${STORE_NAME}
      FRONTEND_URL: ${FRONTEND_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_AUDIENCE: ${JWT_AUDIENCE}
      JWT_ACCESS_SECONDS: ${JWT_ACCESS_SECONDS}
      REFRESH_DAYS: ${REFRESH_DAYS}
      ACTIVATION_HOURS: ${ACTIVATION_HOURS}
      RESEND_COOLDOWN_SECONDS: ${RESEND_COOLDOWN_SECONDS}
      RESEND_HOURLY_LIMIT: ${RESEND_HOURLY_LIMIT}
      LOGIN_ACCOUNT_LIMIT: ${LOGIN_ACCOUNT_LIMIT}
      AUTH_IP_LIMIT: ${AUTH_IP_LIMIT}
      SMTP_SECURE: ${SMTP_SECURE}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      MAIL_FROM: ${MAIL_FROM}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      CLOUDINARY_FOLDER: ${CLOUDINARY_FOLDER:-home-lifestyle/categories}
      CATEGORY_IMAGE_MAX_BYTES: ${CATEGORY_IMAGE_MAX_BYTES:-5242880}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-9007}:${BACKEND_PORT:-9007}"
    volumes:
      - ./backend/src:/app/src
      - ./backend/prisma:/app/prisma
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:'+process.env.PORT+'/api/health',{signal:AbortSignal.timeout(3500)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 4s
      retries: 5
      start_period: 30s
  postgres:
    image: postgres:17.12-bookworm@sha256:40865bc877a289da75963d97d72b59633f639fc5af7a4e856bfa3714cae5b536
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5437}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres_data:
